<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>页面不存在 · XLZ</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; color: #fff;
    background: radial-gradient(80% 60% at 90% 0%, rgba(0,39,118,.55), transparent 60%),
                linear-gradient(160deg, #006B2C 0%, #00481A 55%, #00300F 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .box { max-width: 440px; }
  .flag {
    width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 18px;
    background: #FFDF00; display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .flag::before { content: ""; width: 36px; height: 36px; background: #009C3B; transform: rotate(45deg); border-radius: 7px; }
  .flag::after { content: ""; position: absolute; width: 17px; height: 17px; border-radius: 50%; background: #002776; }
  h1 { margin: 0 0 10px; font-size: 23px; letter-spacing: -.01em; line-height: 1.3; }
  p { margin: 0 0 24px; font-size: 13px; line-height: 1.7; color: rgba(255,255,255,.72); }
  a {
    display: inline-flex; align-items: center; justify-content: center;
    height: 46px; padding: 0 22px; border-radius: 12px;
    background: #FFDF00; color: #0B1F12; font-size: 14px; font-weight: 800; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="flag" aria-hidden="true"></div>
    <h1>页面不存在<br>Página não encontrada</h1>
    <p>The page you are looking for is not here.<br>返回 XLZ 产品展示首页继续浏览。</p>
    <a href="/#/">返回首页 · Início</a>
  </div>
</body>
</html>
